<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahtisham — Coming Soon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0f0f0f;
        font-family: 'Segoe UI', sans-serif;
        color: #ffffff;
      }

      .container {
        text-align: center;
      }

      .name {
        font-size: 1rem;
        letter-spacing: 0.3rem;
        text-transform: uppercase;
        color: #888;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .dot {
        display: inline-block;
        animation: blink 1.4s infinite;
        color: #4ade80;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }

      p {
        color: #888;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="name">Ahtisham Shoukat</p>
      <h1>
        Something is coming<span class="dot">.</span><span class="dot">.</span
        ><span class="dot">.</span>
      </h1>
      <p>Frontend Developer · Available for projects</p>
    </div>
  </body>
</html>
